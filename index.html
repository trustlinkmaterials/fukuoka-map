<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title id="ttl">パチンコ店 商圏マップ</title>
<style>
:root{
  --deck:#e7ebef; --panel:#fff; --ink:#16202b; --ink2:#41505f; --mute:#74838f;
  --rule:#d2d9e0; --rule2:#e6ebf0;
  --base:#0f7a5f; --base-bg:#e3f1ec;
  --big:#9a5407; --big-bg:#fbeed6;
  --mid:#3c5a86; --small:#9fb0bf; --sel:#dde6f2;
  --focus:#1f6feb;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--deck); color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic Medium","Yu Gothic",-apple-system,"Segoe UI",system-ui,sans-serif;
  font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums; font-feature-settings:"palt" 1;
}
button,input,select,textarea{font:inherit;color:inherit}
a{color:#12507a;text-decoration:none;border-bottom:1px solid #b9cede}
a:hover{border-bottom-color:#12507a}
:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.num{font-variant-numeric:tabular-nums}

.app{display:flex;flex-direction:column;height:100%}
header.bar{background:var(--panel);border-bottom:1px solid var(--rule);padding:10px 16px 0;flex:none}
.titlerow{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.01em}
.titlerow .sub{color:var(--mute);font-size:12px}
.caution{margin:4px 0 0;color:var(--ink2);font-size:12px;max-width:80ch}
.tabs{display:flex;gap:2px;margin:10px 0 0}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:6px 12px;color:var(--mute);cursor:pointer;font-size:13px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--base);font-weight:700}
main{flex:1;min-height:0;overflow:hidden;display:flex}
.view{display:none;height:100%;width:100%;min-height:0}
.view.on{display:flex}

.filters{background:var(--panel);border-bottom:1px solid var(--rule);padding:8px 16px;display:none;gap:14px;align-items:center;flex-wrap:wrap;flex:none}
.filters.on{display:flex}
#v-master .filters{display:flex}
.fgroup{display:flex;align-items:center;gap:6px}
.flabel{font-size:11px;color:var(--mute)}
.maptip{position:absolute;z-index:6;pointer-events:none;display:none;max-width:244px;white-space:nowrap;
  background:rgba(13,21,29,.95);color:#fff;font-size:12px;line-height:1.55;
  padding:6px 9px;border-radius:4px;box-shadow:0 3px 12px rgba(0,0,0,.32)}
.maptip b{font-size:13px;display:block;margin-bottom:1px;white-space:normal}
.maptip .tk{color:#9fb6c9}
.maptip .tb{display:inline-block;margin-top:3px;padding:0 6px;border-radius:2px;font-size:11px;font-weight:700;color:#fff}
input[type=search],input[type=number],select,textarea{background:#fbfcfd;border:1px solid var(--rule);border-radius:3px;padding:5px 8px}
input[type=search]{width:210px}
.chip{background:#f3f5f7;border:1px solid var(--rule);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.linkbtn{background:none;border:0;color:#12507a;cursor:pointer;font-size:12px;text-decoration:underline}
.count{font-size:12px;color:var(--ink2);margin-left:auto}

.split{display:flex;flex:1;min-height:0;width:100%}
.pane-list{width:44%;min-width:340px;max-width:620px;border-right:1px solid var(--rule);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.pane-detail{flex:1;min-width:0;overflow:auto;background:var(--deck)}

.lhead,.lrow{display:grid;grid-template-columns:1fr 64px 40px 40px 74px 78px;gap:8px;align-items:center}
body.nopop .lhead,body.nopop .lrow{grid-template-columns:1fr 64px 44px 44px 82px}
body.nopop .pp{display:none}
.lhead{position:sticky;top:0;z-index:2;background:#f5f7f9;border-bottom:1px solid var(--rule);padding:6px 14px;font-size:11px;color:var(--mute)}
.lhead button{background:none;border:0;padding:0;cursor:pointer;color:inherit;font-size:11px}
.lhead .r{text-align:right}
.lhead button.active{color:var(--ink);font-weight:700}
.rows{overflow:auto;flex:1;min-height:0}
.lrow{width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule2);padding:8px 14px;cursor:pointer}
.lrow:hover{background:#f7f9fb}
.lrow[aria-current="true"]{background:var(--sel)}
.lrow .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .ct{font-size:11px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .tot{text-align:right;font-weight:700;font-size:15px}
.lrow .ps{text-align:right;font-size:10px;color:var(--mute)}
.lrow .cell{text-align:right;font-size:13px;color:var(--ink2)}
.lrow .cell.b{color:var(--big);font-weight:600}
.lrow .cell.zero{color:#b3bcc4}
.lrow .unk{font-size:10px;color:var(--mute)}
.star{color:#c9a227}
.empty{padding:28px 16px;color:var(--mute);font-size:13px}

.dwrap{padding:16px 18px 60px;max-width:940px}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:14px 16px;margin-bottom:12px}
.dhead{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.dhead h2{margin:0;font-size:20px;font-weight:700;letter-spacing:.01em}
.dhead .where{color:var(--ink2);font-size:13px;margin-top:2px}
.dhead .big{margin-left:auto;text-align:right;line-height:1.1}
.dhead .big b{font-size:30px;font-weight:700;display:block}
.dhead .big span{font-size:11px;color:var(--mute)}
.pill{display:inline-block;background:var(--base-bg);color:var(--base);border-radius:3px;padding:1px 7px;font-size:11px;font-weight:700;vertical-align:2px}
.pill.warn{background:var(--big-bg);color:var(--big)}
.links{margin-top:10px;padding-top:10px;border-top:1px solid var(--rule2);font-size:12px;display:flex;gap:16px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:2px;border:1px solid var(--rule2);border-radius:4px;overflow:hidden;background:var(--rule2)}
.stat{background:var(--panel);padding:9px 11px}
.stat b{display:block;font-size:19px;font-weight:700;line-height:1.2}
.stat span{font-size:11px;color:var(--mute)}
.stat.b b{color:var(--big)}
h3{font-size:12px;font-weight:700;color:var(--ink2);margin:0 0 8px}
h3 .note{font-weight:400;color:var(--mute)}
.bands{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.band{border:1px solid var(--rule2);border-radius:3px;padding:7px 9px}
.band .k{font-size:11px;color:var(--mute)}
.band .v{font-size:15px;font-weight:700}
.band .v em{font-style:normal;font-size:11px;font-weight:400;color:var(--mute)}
.striparea{overflow-x:auto}
.legend{font-size:11px;color:var(--mute);margin-top:6px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}
table.rivals{width:100%;border-collapse:collapse;font-size:13px}
table.rivals th{text-align:left;font-size:11px;color:var(--mute);font-weight:400;border-bottom:1px solid var(--rule);padding:5px 6px}
table.rivals td{border-bottom:1px solid var(--rule2);padding:6px}
table.rivals td.n{text-align:right}
table.rivals tr.big td{background:#fdf7ec}
table.rivals tr.big td.n.t{color:var(--big);font-weight:700}
table.rivals tr.hot td{box-shadow:inset 2px 0 0 var(--focus)}
.pinno{display:inline-block;min-width:20px;padding:1px 5px;border-radius:10px;color:#fff;font-weight:700;font-size:11px;text-align:center}
.jump{background:none;border:1px solid var(--rule);border-radius:3px;font-size:10px;padding:0 5px;cursor:pointer;color:var(--ink2)}
#dmap{height:430px;border:1px solid var(--rule2);border-radius:3px;background:#fcfdfe}
.memo{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start}
textarea.memo-in{width:100%;min-height:60px;resize:vertical}
.savenote{font-size:11px;color:var(--mute);margin-top:6px}
.starbtn{background:#f3f5f7;border:1px solid var(--rule);border-radius:3px;padding:5px 10px;cursor:pointer;font-size:12px;white-space:nowrap}
.starbtn[aria-pressed="true"]{background:#fdf6e0;border-color:#e3cc84;color:#7a5c05}

/* map view */
#v-map{position:relative}
#omap{flex:1;height:100%;background:#dfe5ea}
.mapctl{position:absolute;top:10px;right:10px;z-index:600;background:rgba(255,255,255,.95);border:1px solid var(--rule);border-radius:4px;padding:9px 11px;font-size:12px;width:214px;box-shadow:0 1px 4px rgba(20,32,44,.12)}
.mapctl .row{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.mapctl .row:last-child{margin-bottom:0}
.mapctl .k{color:var(--mute);font-size:11px}
.mapcard{position:absolute;left:10px;bottom:10px;z-index:600;background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:11px 13px;width:290px;box-shadow:0 1px 6px rgba(20,32,44,.16);display:none}
.mapcard.on{display:block}
.mapcard h4{margin:0 0 2px;font-size:15px}
.mapcard .m{font-size:11px;color:var(--mute)}
.mapcard .kv{display:flex;gap:12px;margin:7px 0;font-size:12px}
.mapcard .kv b{font-size:16px;display:block;line-height:1.1}
.mapcard .acts{display:flex;gap:8px;margin-top:8px}
.mapcard button{background:var(--ink);color:#fff;border:0;border-radius:3px;padding:5px 10px;font-size:12px;cursor:pointer}
.mapcard button.ghost{background:#f3f5f7;color:var(--ink2);border:1px solid var(--rule)}
input[type=range]{accent-color:#0f7a5f;height:16px}
#omap svg text{font-family:inherit;paint-order:stroke;stroke:#fff;stroke-width:2px;stroke-linejoin:round}
#dmap svg text{font-family:inherit;paint-order:stroke;stroke:#fff;stroke-width:.7px;stroke-linejoin:round}
.zbtns{position:absolute;top:10px;left:10px;z-index:600;display:flex;flex-direction:column;gap:4px}
.zbtns button{width:32px;height:30px;background:rgba(255,255,255,.95);border:1px solid var(--rule);border-radius:3px;cursor:pointer;font-size:15px}
.zbtns button.wide{width:32px;font-size:10px}

.plain{flex-direction:column;overflow:auto;width:100%}
.plainwrap{padding:16px 18px 60px;max-width:1080px;width:100%}
table.grid{width:100%;border-collapse:collapse;font-size:13px;background:var(--panel)}
table.grid th{text-align:left;font-size:11px;color:var(--mute);font-weight:400;background:#f5f7f9;border-bottom:1px solid var(--rule);padding:6px;position:sticky;top:0}
table.grid td{border-bottom:1px solid var(--rule2);padding:6px}
table.grid td.n{text-align:right}
table.grid tr.cand td:first-child{box-shadow:inset 3px 0 0 var(--base)}
table.notes th{width:150px;vertical-align:top}
tr.grow{cursor:pointer}
tr.grow:hover td{background:#f7f9fb}
tr.gmem td{background:#fbfcfd;font-size:12px}
.gm{display:inline-block;margin:2px 12px 2px 0}
.gm.c{font-weight:700;color:var(--base);cursor:pointer}
.clbadge{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.backbtn{display:none}
body.locked .app{display:none}
#gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--deck);padding:20px}
body:not(.locked) #gate{display:none}
#gateform{background:var(--panel);border:1px solid var(--rule);border-radius:5px;padding:26px 28px;width:380px;max-width:100%;box-shadow:0 2px 14px rgba(20,32,44,.10)}
#gateform h2{margin:0 0 6px;font-size:18px}
#gateform p{margin:0 0 18px;font-size:12px;color:var(--ink2);line-height:1.6}
#gateform label{display:block;font-size:12px;color:var(--ink2);margin-bottom:12px}
#gateform input{display:block;width:100%;margin-top:4px;padding:8px 10px;border:1px solid var(--rule);border-radius:3px;background:#fbfcfd;font-size:14px}
#gbtn{width:100%;padding:9px;background:var(--ink);color:#fff;border:0;border-radius:3px;font-size:14px;cursor:pointer;margin-top:4px}
#gbtn:disabled{opacity:.6;cursor:default}
#gmsg{margin-top:10px;font-size:12px;min-height:1.4em;color:var(--big)}
.gfoot{margin-top:16px;padding-top:12px;border-top:1px solid var(--rule2);font-size:11px;color:var(--mute);line-height:1.6}

.fbtn,.ctlbtn{display:none}

@media (max-width:860px){
  .pane-list{width:100%;min-width:0;max-width:none;border-right:0}
  .pane-detail{position:fixed;inset:0;z-index:1000;display:none;overflow:auto}
  body.detail-open .pane-detail{display:block}
  body.detail-open{overflow:hidden}
  .backbtn{display:inline-block;background:var(--panel);border:1px solid var(--rule);border-radius:3px;padding:6px 12px;cursor:pointer;margin-bottom:10px;font-size:13px}
  .lhead,.lrow{grid-template-columns:1fr 58px 40px 40px}
  .lhead .pp,.lrow .pp{display:none}
  .lhead .sp,.lrow .sp{display:none}
  .bands{grid-template-columns:repeat(2,1fr)}
  input[type=search]{width:100%}
  .fgroup.grow{flex:1 1 100%}
  .mapctl{width:150px;padding:7px 8px}
  .mapcard{left:8px;right:8px;width:auto}
}

/* ===== スマートフォン ===== */
@media (max-width:700px){
  body{font-size:15px}
  header.bar{padding:8px 12px 0}
  h1{font-size:15.5px}
  .titlerow .sub{font-size:11px}
  .caution{display:none}                      /* 同じ内容は「調査メモ」にある */
  .tabs{margin-top:8px;overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;
        scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{white-space:nowrap;padding:7px 10px;font-size:13px;flex:none}

  /* 絞り込みは既定で畳む。画面の大半を占めてしまうため */
  .filters{padding:7px 12px;gap:8px;position:relative}
  .fbtn{display:block;background:#f3f5f7;border:1px solid var(--rule);border-radius:3px;
        padding:7px 12px;font-size:13px;cursor:pointer;color:var(--ink2);flex:none}
  body.fopen .fbtn{background:var(--ink);border-color:var(--ink);color:#fff}
  .filters>*{display:none}
  .filters>.fbtn,.filters>.count{display:block}
  .filters>.fgroup.grow{display:flex;flex:1 1 100%;order:-1}
  body.fopen .filters>*{display:flex}
  body.fopen .filters>.fbtn{display:block}
  .count{margin-left:auto;font-size:12px}
  .fgroup{flex-wrap:wrap}
  .fgroup select,.fgroup input[type=number]{max-width:100%}
  .chip{padding:5px 12px;font-size:13px}        /* 指で押せる大きさ */
  .linkbtn{font-size:13px;padding:4px 0}

  /* 一覧 */
  .lhead,.lrow{grid-template-columns:1fr 62px 34px 34px;gap:5px;padding-left:12px;padding-right:12px}
  .lhead .sp,.lrow .sp{display:none}
  .lhead>div:nth-child(5),.lhead>div:nth-child(6){display:none}
  .lrow{padding-top:10px;padding-bottom:10px}
  .lrow .nm{font-size:15px;white-space:normal}
  .lrow .tot{font-size:16px}

  /* 詳細 */
  .dwrap{padding:12px 12px 48px}
  .card{padding:12px 12px}
  .dhead h2{font-size:18px}
  .dhead .big{margin-left:0;text-align:left}
  .dhead .big b{font-size:26px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .stat b{font-size:17px}
  .bands{grid-template-columns:repeat(2,1fr)}
  #dmap{height:58vh;min-height:300px}
  .tblscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table.rivals{min-width:560px}
  .plainwrap{padding:12px 12px 48px}
  .plainwrap table.grid{min-width:680px}
  .plainwrap>div{overflow-x:auto}
  .memo{grid-template-columns:1fr}
  .backbtn{padding:9px 16px;font-size:14px}

  /* 全県マップ：地図を広く使い、設定は畳む */
  .ctlbtn{display:block;position:absolute;top:10px;right:10px;z-index:601;
          background:rgba(255,255,255,.96);border:1px solid var(--rule);border-radius:3px;
          padding:7px 11px;font-size:13px;cursor:pointer;color:var(--ink2)}
  body.ctlopen .ctlbtn{background:var(--ink);border-color:var(--ink);color:#fff}
  .mapctl{display:none;top:48px;left:10px;right:10px;width:auto;max-height:58vh;overflow:auto;padding:10px 12px}
  body.ctlopen .mapctl{display:block}
  .mapctl .row{margin-bottom:9px}
  .mapctl label{display:flex;align-items:center;gap:7px}
  .mapctl input[type=checkbox]{width:18px;height:18px}
  .zbtns button{width:38px;height:36px;font-size:17px}
  .maptip{max-width:200px;font-size:11.5px}

  #gateform{padding:20px 18px}
}
@media (prefers-reduced-motion:no-preference){ .lrow{transition:background .08s linear} }
</style>
</head>
<body data-tab="cand" class="locked">
<div id="gate">
  <form id="gateform" autocomplete="off">
    <h2 id="gtitle">パチンコ店 商圏マップ</h2>
    <p>閲覧にはIDとパスワードが必要です。データは暗号化されており、認証後にのみ表示されます。ネットにつながっていなくても開けます。</p>
    <label>ID<input type="text" id="gid" autocomplete="username" spellcheck="false" autocapitalize="off"></label>
    <label>パスワード<input type="password" id="gpw" autocomplete="current-password"></label>
    <button type="submit" id="gbtn">開く</button>
    <div id="gmsg"></div>
    <div class="gfoot">取扱注意：本資料は掲載情報をもとにした一次リストです。第三者への再配布はご遠慮ください。</div>
  </form>
</div>
<div class="app">
<header class="bar">
  <div class="titlerow">
    <h1 id="h1">パチンコ店 商圏マップ</h1>
    <div class="sub" id="sub"></div>
  </div>
  <p class="caution" id="caution"></p>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true" data-view="cand">候補一覧</button>
    <button class="tab" role="tab" aria-selected="false" data-view="map">全県マップ</button>
    <button class="tab" role="tab" aria-selected="false" data-view="grp">法人別</button>
    <button class="tab" role="tab" aria-selected="false" data-view="master"><span id="mtab">店舗マスター</span></button>
    <button class="tab" role="tab" aria-selected="false" data-view="notes">調査メモ</button>
  </div>
</header>

<div class="filters on" id="candfilters">
  <button type="button" class="fbtn" id="fbtn" aria-expanded="false">絞り込み・並び替え ▾</button>
  <div class="fgroup grow"><input type="search" data-f="q" placeholder="店名・住所・市区町村で検索" aria-label="検索"></div>
  <div class="fgroup"><select data-f="city" aria-label="市区町村"><option value="">市区町村すべて</option></select></div>
  <div class="fgroup"><select data-f="grp" aria-label="法人"><option value="">法人すべて</option></select></div>
  <div class="fgroup"><select data-f="cl" aria-label="商圏クラスタ"><option value="">商圏クラスタすべて</option></select></div>
  <div class="fgroup">
    <span class="flabel">商圏</span>
    <select id="rkm" style="font-size:12px">
      <option value="1">半径1km</option><option value="2">半径2km</option>
      <option value="3">半径3km</option><option value="5" selected>半径5km</option>
      <option value="7">半径7km</option><option value="10">半径10km</option>
    </select>
  </div>
  <div class="fgroup">
    <span class="flabel">合計台数</span>
    <input type="number" data-f="tmin" placeholder="下限" min="0" step="50" style="width:74px">
    <span class="flabel">〜</span>
    <input type="number" data-f="tmax" placeholder="上限" min="0" step="50" style="width:74px">
  </div>
  <div class="fgroup" data-key="riv">
    <span class="flabel" id="lblRiv">商圏内の競合</span>
    <button class="chip" data-v="">すべて</button><button class="chip" data-v="lo">5店以下</button>
    <button class="chip" data-v="mid">6〜12店</button><button class="chip" data-v="hi">13店以上</button>
  </div>
  <div class="fgroup" data-key="big">
    <span class="flabel">1,000台以上の競合</span>
    <button class="chip" data-v="">すべて</button><button class="chip" data-v="0">なし</button>
    <button class="chip" data-v="1">1〜2店</button><button class="chip" data-v="3">3店以上</button>
  </div>
  <div class="fgroup" data-key="star"><button class="chip" data-v="1">★だけ</button></div>
  <div class="fgroup">
    <select data-f="sort" aria-label="並び替え">
      <option value="tot-">台数が多い順</option><option value="tot+">台数が少ない順</option>
      <option value="riv+">競合が少ない順</option><option value="riv-">競合が多い順</option>
      <option value="big+">1,000台以上の競合が少ない順</option>
      <option value="near-">大型店が遠い順</option>
      <option value="area+">商圏内の総台数が少ない順</option>
      <option value="share-">商圏内シェアが高い順</option>
      <option value="ppm-">1台あたり人口が多い順</option>
      <option value="pop-">商圏人口が多い順</option>
      <option value="city+">市区町村順</option><option value="id+">候補ID順</option>
    </select>
  </div>
  <button class="linkbtn" id="reset">条件を戻す</button>
  <button class="linkbtn" id="csv">CSVで書き出す</button>
  <div class="count" id="count"></div>
</div>

<main>
  <section class="view on" id="v-cand">
    <div class="split">
      <div class="pane-list">
        <div class="lhead">
          <div><button data-sort="name">店名・市区町村</button></div>
          <div class="r"><button data-sort="tot">合計台数</button></div>
          <div class="r"><button data-sort="riv">競合</button></div>
          <div class="r"><button data-sort="big">大型</button></div>
          <div class="r sp"><button data-sort="near">大型店まで</button></div>
          <div class="r pp"><button data-sort="ppm">1台あたり人口</button></div>
        </div>
        <div class="rows" id="rows"></div>
      </div>
      <div class="pane-detail" id="detail"></div>
    </div>
  </section>

  <section class="view" id="v-map">
    <div id="omap"></div>
    <div class="zbtns"><button id="zin" title="拡大">＋</button><button id="zout" title="縮小">−</button><button id="zreset" class="wide" title="全体">全体</button></div>
    <button type="button" class="ctlbtn" id="ctlbtn" aria-expanded="false">表示設定 ▾</button>
    <div class="mapctl" id="mapctl">
      <div class="row"><select id="provider" style="width:100%;font-size:11px"></select></div>
      <div class="row"><select id="hazard" style="width:100%;font-size:11px"></select></div>
      <div class="row"><span class="k">ズーム <b id="zval" style="font-size:12px;color:var(--ink)">9.0</b></span>
        <select id="zsens" style="font-size:10px;padding:1px 2px;margin-left:auto">
          <option value="0.5">細かい</option><option value="1" selected>標準</option><option value="2">大きい</option>
        </select></div>
      <div class="row"><input type="range" id="zrange" min="7" max="19" step="0.1" value="9" style="width:100%;margin:0"></div>
      <div class="row"><label><input type="checkbox" id="showRiv" checked> 条件外の店も薄く表示</label></div>
      <div class="row"><label><input type="checkbox" id="circles"> 商圏の円を描く</label></div>
      <div class="row"><label><input type="checkbox" id="cityname" checked> 市区町村名</label></div>
      <div class="row"><label><input type="checkbox" id="bbox"> 表示範囲で一覧を絞る</label></div>
      <div class="row"><label><input type="checkbox" id="clust"> 商圏クラスタで色分け</label></div>
      <div class="row"><button class="linkbtn" id="kmlAll">表示中の候補をKMLで書き出す</button></div>
      <div class="row"><span class="k" id="mapnote"></span></div>
    </div>
    <div class="mapcard" id="mapcard"></div>
  </section>

  <section class="view plain" id="v-grp">
    <div class="plainwrap">
      <p style="margin:0 0 12px;font-size:12px;color:var(--ink2);max-width:80ch">店名から同一チェーンを推定してまとめています。運営法人そのものではないので、打診前に法人名は確認してください。行をクリックすると店舗が開きます。</p>
      <div id="gtable"></div>
    </div>
  </section>

  <section class="view plain" id="v-master">
    <div class="filters">
      <div class="fgroup grow"><input type="search" id="mq" placeholder="店名・住所・市区町村で検索" aria-label="店舗マスター検索"></div>
      <div class="count" id="mcount"></div>
    </div>
    <div class="plainwrap"><div id="mtable"></div></div>
  </section>

  <section class="view plain" id="v-notes">
    <div class="plainwrap">
      <div class="card" style="max-width:820px">
        <h3>調査の範囲と未確認事項</h3>
        <table class="grid notes" id="ntable"></table>
      </div>
      <div class="card" style="max-width:820px">
        <h3>地図の座標について</h3>
        <div id="geonote" style="font-size:13px;color:var(--ink2)"></div>
      </div>
    </div>
  </section>
</main>
</div>

<script>
"use strict";
function boot(PAYLOAD){
const DATA = JSON.parse(PAYLOAD);
const CANDS = DATA.cands, FAC = DATA.fac, NOTES = DATA.notes, COORD = DATA.coord;
/* 店舗マスターは候補一覧から組み立てる（データを二重に持たない） */
const MASTER = DATA.master || CANDS.map(c=>({id:c.hid,name:c.name,city:c.city,addr:c.addr,
  p:c.p,s:c.s,total:c.total,kind:'掲載店',memo:c.mate?('併設：'+c.mate):'',url:c.url,hid:c.hid,grp:c.grp}));
let RKM = 5;
const LOK = true;
const fmt = n => (n==null||n==='')?'—':Number(n).toLocaleString('ja-JP');
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const glink = a => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(a)}`;
const tier = t => t>=1000 ? 'big' : (t>=701 ? 'mid' : 'small');
const tierColor = t => ({big:'#9a5407',mid:'#3c5a86',small:'#9fb0bf'})[tier(t)];
const rad = t => Math.max(3.5, Math.min(15, Math.sqrt(t||100)/2.6));

/* ---- 商圏はその場で計算する。半径を変えれば全部が再計算される ---- */
const hav=(a,b)=>{
  const R=6371.0088, r=Math.PI/180;
  const p1=a[0]*r, p2=b[0]*r, dp=(b[0]-a[0])*r, dl=(b[1]-a[1])*r;
  return 2*R*Math.asin(Math.sqrt(Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2));
};
/* ---- 国勢調査 500mメッシュ人口（あれば商圏人口を出す） ---- */
const MESH=(()=>{
  const src=DATA.mesh;
  if(!src||!src.c||!src.c.length) return null;
  const pts=new Array(src.c.length);
  for(let i=0;i<src.c.length;i++){
    const s=String(src.c[i]);
    /* 標準地域メッシュ：1次4桁＋2次2桁＋3次2桁＋4次1桁（500m） */
    let lat=(+s.slice(0,2))/1.5, lng=(+s.slice(2,4))+100;
    lat+=(+s[4])*5/60;      lng+=(+s[5])/8;
    lat+=(+s[6])*30/3600;   lng+=(+s[7])*45/3600;
    if(s.length>=9){ const g=+s[8];
      lat+=(g>2?1:0)*15/3600; lng+=((g%2)===0?1:0)*22.5/3600;
      lat+=7.5/3600; lng+=11.25/3600;
    }else{ lat+=15/3600; lng+=22.5/3600; }
    pts[i]={lat,lng,p:src.p[i]};
  }
  const g=new Map();
  pts.forEach((m,i)=>{ const k=Math.floor(m.lat/0.05)+','+Math.floor(m.lng/0.05);
    if(!g.has(k)) g.set(k,[]); g.get(k).push(i); });
  return {pts,grid:g,total:src.p.reduce((a,b)=>a+b,0),year:DATA.meta&&DATA.meta.meshYear};
})();
const CELL=0.1, GRID=new Map();
FAC.forEach((f,i)=>{
  if(f.lat==null) return;
  const k=Math.floor(f.lat/CELL)+','+Math.floor(f.lng/CELL);
  if(!GRID.has(k)) GRID.set(k,[]);
  GRID.get(k).push(i);
});
CANDS.forEach(c=>{ c.hay=[c.id,c.name,c.city,c.addr].join(' ').toLowerCase(); });
const BY_ID = Object.fromEntries(CANDS.map(c=>[c.id,c]));
let BANDS=[];
function deriveAll(){
  const R=RKM;
  BANDS=[[0,R*0.2],[R*0.2,R*0.4],[R*0.4,R*0.6],[R*0.6,R+1e-9]];
  const span=Math.ceil(R/11.0)+1;
  CANDS.forEach(c=>{
    const p=COORD[c.hid];
    c.known=!!p;
    if(!p){ c.list=[]; c.nRiv=c.nBig=c.n701=c.areaT=c.share=c.nearBig=null;
      c.bands=BANDS.map(()=>({n:0,t:0,big:0})); return; }
    const gx=Math.floor(p[0]/CELL), gy=Math.floor(p[1]/CELL), list=[];
    for(let i=-span;i<=span;i++) for(let j=-span;j<=span;j++){
      const arr=GRID.get((gx+i)+','+(gy+j)); if(!arr) continue;
      for(const fi of arr){
        if(fi===c.f) continue;
        const f=FAC[fi];
        const km=hav([p[0],p[1]],[f.lat,f.lng]);
        if(km<=R) list.push({id:f.h,name:f.name,km:+km.toFixed(2),p:f.p,s:f.s,total:f.total,
          city:f.city,addr:f.addr,alsoCand:f.c,url:f.url});
      }
    }
    list.sort((a,b)=>a.km-b.km);
    c.list=list;
    c.nRiv=list.length;
    c.nBig=list.filter(r=>r.total>=1000).length;
    c.n701=list.filter(r=>r.total>=701).length;
    c.areaT=list.reduce((s,r)=>s+(r.total||0),0);
    c.share=c.total/((c.total+c.areaT)||1);
    const bigs=list.filter(r=>r.total>=1000);
    c.nearBig=bigs.length?bigs[0].km:null;
    if(MESH){
      let pop=0;
      const sp2=Math.ceil(R/5.0)+1, gx2=Math.floor(p[0]/0.05), gy2=Math.floor(p[1]/0.05);
      for(let i=-sp2;i<=sp2;i++) for(let j=-sp2;j<=sp2;j++){
        const arr=MESH.grid.get((gx2+i)+','+(gy2+j)); if(!arr) continue;
        for(const mi of arr){ const m=MESH.pts[mi];
          if(hav([p[0],p[1]],[m.lat,m.lng])<=R) pop+=m.p; }
      }
      c.pop=pop;
      const dai=c.total+c.areaT;
      c.ppm=dai>0?pop/dai:null;
    }else{ c.pop=null; c.ppm=null; }
    c.bands=BANDS.map(([a,b])=>{ const x=list.filter(r=>r.km>=a&&r.km<b);
      return {n:x.length,t:x.reduce((s,r)=>s+(r.total||0),0),big:x.filter(r=>r.total>=1000).length}; });
  });
  buildClusters();
}
const bandLabel=i=>{
  const f=v=>Number(v.toFixed(1)).toString();
  return `${f(BANDS[i][0])}〜${f(Math.min(BANDS[i][1],RKM))}km`;
};
const META = DATA.meta || {};
{
  const t=(META.pref||'')+' パチンコ店 商圏マップ';
  ['ttl','h1','gtitle'].forEach(i=>{const e=document.getElementById(i); if(e) e.textContent=t;});
  const sub=document.getElementById('sub');
  if(sub) sub.textContent=`${fmt(CANDS.length)}店／商圏は座標から自動計算／${META.date||''}時点`;
  const ca=document.getElementById('caution');
  if(ca) ca.textContent=META.caution||'掲載情報をもとにした一次リストです。売却意向、法人・資産、出玉の実態は未調査。距離は住所から算出した直線距離で、道路距離ではありません。';
  const mt=document.getElementById('mtab');
  if(mt) mt.textContent=`店舗マスター ${fmt(MASTER.length)}店`;
}
const GRP_OF = Object.fromEntries(MASTER.map(m=>[m.id,m.grp||null]));

/* 商圏クラスタ：候補同士が5km圏で重なるものを連結成分でまとめる */
const PAL=['#c2410c','#1d4ed8','#0f766e','#7c3aed','#b45309','#be123c','#15803d','#0369a1','#9d174d','#4d7c0f','#a16207','#1e40af'];
let CL=[], CL_BY_I={};
function buildClusters(){
  const adj={}; CANDS.forEach(c=>{ adj[c.id]=new Set(); c.cl=null; });
  CANDS.forEach(c=>c.list.forEach(r=>{ if(r.alsoCand&&adj[r.alsoCand]){ adj[c.id].add(r.alsoCand); adj[r.alsoCand].add(c.id); } }));
  CL=[];
  CANDS.forEach(c=>{
    if(c.cl!=null) return;
    const seen=new Set(), st=[c.id];
    while(st.length){ const x=st.pop(); if(seen.has(x)) continue; seen.add(x); adj[x].forEach(y=>{ if(!seen.has(y)) st.push(y); }); }
    const ids=[...seen], i=CL.length;
    ids.forEach(id=>BY_ID[id].cl=i);
    const cities=Object.entries(ids.reduce((a,id)=>{a[BY_ID[id].city]=(a[BY_ID[id].city]||0)+1;return a;},{})).sort((a,b)=>b[1]-a[1]);
    CL.push({i,ids,size:ids.length,total:ids.reduce((s,id)=>s+BY_ID[id].total,0),
      label: ids.length===1 ? BY_ID[ids[0]].name+'（単独商圏）' : cities.slice(0,2).map(x=>x[0]).join('・')+`ほか ${ids.length}店`});
  });
  CL.sort((a,b)=>b.size-a.size).forEach((cl,rank)=>{ cl.color = cl.size===1 ? '#111827' : PAL[rank%PAL.length]; });
  CL_BY_I=Object.fromEntries(CL.map(c=>[c.i,c]));
}

/* 法人（推定）ごとの集計 */
const GROUPS={};
MASTER.forEach(m=>{
  const g=m.grp||'__solo';
  (GROUPS[g]=GROUPS[g]||{name:m.grp||'チェーン名を特定できない店',key:g,all:[],cands:[]}).all.push(m);
});
CANDS.forEach(c=>{ const g=c.grp||'__solo'; if(GROUPS[g]) GROUPS[g].cands.push(c); });
const GLIST=Object.values(GROUPS).map(g=>({...g,
  nAll:g.all.length,tAll:g.all.reduce((s,m)=>s+m.total,0),
  nC:g.cands.length,tC:g.cands.reduce((s,c)=>s+c.total,0),
  cities:[...new Set(g.all.map(m=>m.city))]})).sort((a,b)=>(a.key==='__solo')-(b.key==='__solo')||b.nC-a.nC||b.nAll-a.nAll);

/* notes: star + memo */
const KEY='aichi-mna-notes-v1';
let NOTE={}, saveState='', saveTimer=null;
const store={
  async load(){
    try{ if(window.storage){const r=await window.storage.get(KEY); if(r&&r.value) return JSON.parse(r.value);} }catch(e){}
    try{ const s=window.localStorage&&localStorage.getItem(KEY); if(s) return JSON.parse(s); }catch(e){}
    return null;
  },
  async save(o){
    const s=JSON.stringify(o);
    try{ if(window.storage){await window.storage.set(KEY,s); return 'ok';} }catch(e){}
    try{ if(window.localStorage){localStorage.setItem(KEY,s); return 'ok';} }catch(e){}
    return 'mem';
  }
};
function queueSave(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    const r=await store.save(NOTE);
    saveState = r==='ok' ? '★とメモはこの端末に保存されます。' : '★とメモはこのページを閉じると消えます。CSVで書き出してください。';
    const el=document.getElementById('savenote'); if(el) el.textContent=saveState;
  },250);
}
const nOf = id => NOTE[id] || (NOTE[id]={star:false,memo:''});

/* filters */
const F={q:'',city:'',grp:'',cl:'',tmin:'',tmax:'',riv:'',big:'',star:'',sort:'tot-',bbox:null};
const MF={q:'',kind:''};
let selected=null;
function pass(c){
  if(F.q && !c.hay.includes(F.q)) return false;
  if(F.city && c.city!==F.city) return false;
  if(F.grp){ if(F.grp==='__solo'? c.grp : c.grp!==F.grp) return false; }
  if(F.cl){ if(F.cl==='__alone'? CL_BY_I[c.cl].size!==1 : String(c.cl)!==F.cl) return false; }
  if(F.tmin!=='' && c.total<+F.tmin) return false;
  if(F.tmax!=='' && c.total>+F.tmax) return false;
  if(F.riv){ if(c.nRiv==null) return false;
    if(F.riv==='lo'&&c.nRiv>5) return false;
    if(F.riv==='mid'&&!(c.nRiv>=6&&c.nRiv<=12)) return false;
    if(F.riv==='hi'&&c.nRiv<13) return false; }
  if(F.big){ if(c.nBig==null) return false;
    if(F.big==='0'&&c.nBig!==0) return false;
    if(F.big==='1'&&!(c.nBig>=1&&c.nBig<=2)) return false;
    if(F.big==='3'&&c.nBig<3) return false; }
  if(F.star && !nOf(c.id).star) return false;
  if(F.bbox){ const p=COORD[c.hid];
    if(!p||p[0]>F.bbox.n||p[0]<F.bbox.s||p[1]<F.bbox.w||p[1]>F.bbox.e) return false; }
  return true;
}
function sortList(a){
  const k=F.sort.slice(0,-1), dir=F.sort.slice(-1)==='-'?-1:1;
  const get={tot:c=>c.total,riv:c=>c.nRiv,big:c=>c.nBig,near:c=>c.nearBig,area:c=>c.areaT,share:c=>c.share,
    pop:c=>c.pop,ppm:c=>c.ppm,city:c=>c.city,id:c=>c.id,name:c=>c.name};
  const g=get[k]||get.tot;
  return a.sort((x,y)=>{
    const vx=g(x),vy=g(y);
    if(vx==null&&vy==null) return x.id<y.id?-1:1;
    if(vx==null) return 1; if(vy==null) return -1;
    if(typeof vx==='string') return dir*vx.localeCompare(vy,'ja');
    return vx===vy?(x.id<y.id?-1:1):dir*(vx-vy);
  });
}

/* distance strip (list rows + map-less fallback) */
function strip(c,{w=118,h=30,labels=false}={}){
  if(!c.known) return '<span class="unk">周辺未確認</span>';
  if(!c.list.length) return '<span class="unk">商圏内に他店なし</span>';
  const pad=labels?26:8,W=w,H=h,y0=H/2;
  const x=km=>pad+(km/5)*(W-pad*2);
  const r=t=>Math.max(2.2,Math.min(labels?11:6,Math.sqrt(t||100)/(labels?4.2:8.5)));
  let s=`<svg viewBox="0 0 ${W} ${H}" ${labels?'style="width:100%;max-width:820px;height:auto"':`width="${W}" height="${H}"`} role="img" aria-label="5km圏の競合分布">`;
  s+=`<line x1="${pad}" y1="${y0}" x2="${W-pad}" y2="${y0}" stroke="var(--rule)"/>`;
  for(let k=1;k<=5;k++) s+=`<line x1="${x(k)}" y1="${y0-3}" x2="${x(k)}" y2="${y0+3}" stroke="var(--rule)"/>`;
  s+=`<circle cx="${x(0)}" cy="${y0}" r="${labels?5:3.4}" fill="var(--base)"/>`;
  if(labels) for(let k=0;k<=5;k++) s+=`<text x="${x(k)}" y="${H-4}" font-size="9" fill="var(--mute)" text-anchor="middle">${k}km</text>`;
  c.list.forEach((v,i)=>{
    const off=(i%2?-1:1)*(labels?20:5)*(i%4<2?1:0.5);
    s+=`<circle cx="${x(v.km)}" cy="${y0+off}" r="${r(v.total).toFixed(1)}" fill="${tierColor(v.total)}" fill-opacity="${v.total>=1000?0.92:0.7}" stroke="var(--panel)" stroke-width="${labels?1.2:0.8}"><title>${esc(v.name)} ${fmt(v.total)}台 ${v.km}km</title></circle>`;
  });
  return s+'</svg>';
}

/* list */
function render(){ renderList(); if(OV.ready) OV.map.render(); }
function renderList(){
  const rows=sortList(CANDS.filter(pass));
  document.querySelectorAll('#count').forEach(e=>e.textContent=
    `${rows.length}件 / ${CANDS.length}件`+(F.bbox?'（地図の範囲内）':''));
  const box=document.getElementById('rows');
  if(!rows.length){ box.innerHTML='<p class="empty">条件に合う候補がありません。条件を戻すか、検索語を短くしてください。</p>'; }
  else box.innerHTML=rows.map(c=>{
    const n=nOf(c.id), bigCls=c.nBig?'cell b':(c.nBig===0?'cell zero':'cell');
    return `<button class="lrow" data-id="${c.id}" aria-current="${selected===c.id}">

/* ---------- 地図：タイル画像＋SVGの自前実装。読めない環境では枠線表示に落ちる ---------- */
const SHAPE=DATA.shape;
const SVGNS='http://www.w3.org/2000/svg';
let ZSENS=1;
/* 重ねるハザードマップ（国土地理院）のタイル */
const HAZARDS={
  none:{label:'ハザードなし',url:null},
  flood:{label:'洪水浸水想定（想定最大規模）',max:17,
    url:(z,x,y)=>`https://disaportaldata.gsi.go.jp/raster/01_flood_l2_shinsuishin_data/${z}/${x}/${y}.png`},
  tsunami:{label:'津波浸水想定',max:17,
    url:(z,x,y)=>`https://disaportaldata.gsi.go.jp/raster/04_tsunami_newlegend_data/${z}/${x}/${y}.png`},
  hightide:{label:'高潮浸水想定（想定最大規模）',max:17,
    url:(z,x,y)=>`https://disaportaldata.gsi.go.jp/raster/03_hightide_l2_shinsuishin_data/${z}/${x}/${y}.png`},
  dosekiryu:{label:'土石流警戒区域',max:17,
    url:(z,x,y)=>`https://disaportaldata.gsi.go.jp/raster/05_dosekiryukeikaikuiki/${z}/${x}/${y}.png`}
};
let HAZARD='none';
/* 距離帯の色（3km / 5km / 7km / 10km） */
const BAND_COL=['#c2410c','#2563eb','#7c3aed','#64748b','#334155'];
const bandList=()=>{ const b=[3,5,7,10].filter(k=>k<=RKM+1e-6);
  if(!b.length||b[b.length-1]<RKM-1e-6) b.push(RKM); return b; };
const PROVIDERS={
  gsi:{label:'淡色地図（おすすめ・道路あり）',max:18,attr:'国土地理院',
       url:(z,x,y)=>`https://cyberjapandata.gsi.go.jp/xyz/pale/${z}/${x}/${y}.png`},
  std:{label:'標準地図（情報量が多い）',max:18,attr:'国土地理院',
       url:(z,x,y)=>`https://cyberjapandata.gsi.go.jp/xyz/std/${z}/${x}/${y}.png`},
  photo:{label:'航空写真（国土地理院）',max:18,attr:'国土地理院 全国最新写真',
       url:(z,x,y)=>`https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/${z}/${x}/${y}.jpg`},
  blank:{label:'白地図（道路なし）',max:18,attr:'国土地理院',
       url:(z,x,y)=>`https://cyberjapandata.gsi.go.jp/xyz/blank/${z}/${x}/${y}.png`},
  none:{label:'地図なし（枠線と距離だけ）',max:18,attr:'',url:null}
};
let PROVIDER='gsi';
const TS=256;
const wx=(lng,z)=>(lng+180)/360*TS*Math.pow(2,z);
const wy=(lat,z)=>{const s=Math.sin(lat*Math.PI/180);
  return (0.5-Math.log((1+s)/(1-s))/(4*Math.PI))*TS*Math.pow(2,z);};
const lngOf=(x,z)=>x/(TS*Math.pow(2,z))*360-180;
const latOf=(y,z)=>{const n=Math.PI-2*Math.PI*y/(TS*Math.pow(2,z));
  return 180/Math.PI*Math.atan(0.5*(Math.exp(n)-Math.exp(-n)));};
const mpp=(lat,z)=>156543.03392*Math.cos(lat*Math.PI/180)/Math.pow(2,z);
const accNote=id=>{const e=COORD[id]&&COORD[id][3];
  return (e!=null&&e>300)?`／位置の照合誤差 中央値${e}m`:'';};
function svgEl(tag,attr,parent){
  const n=document.createElementNS(SVGNS,tag);
  for(const k in attr) if(attr[k]!=null) n.setAttribute(k,attr[k]);
  if(parent) parent.appendChild(n);
  return n;
}

function makeMap(box,opt){
  box.innerHTML='';
  box.style.position='relative'; box.style.overflow='hidden'; box.style.touchAction='none';
  box.style.background='#eaeef1'; box.style.cursor='grab';
  const tiles=document.createElement('div');
  tiles.style.cssText='position:absolute;inset:0;overflow:hidden';
  const hz=document.createElement('div');
  hz.style.cssText='position:absolute;inset:0;overflow:hidden;opacity:.62;pointer-events:none';
  const ov=document.createElementNS(SVGNS,'svg');
  ov.style.cssText='position:absolute;inset:0;width:100%;height:100%;pointer-events:none';
  const note=document.createElement('div');
  note.style.cssText='position:absolute;left:6px;bottom:4px;z-index:5;font-size:10px;color:#41505f;background:rgba(255,255,255,.75);padding:1px 6px;border-radius:2px;max-width:70%';
  box.append(tiles,hz,ov,note);
  const M={box,tiles,hz,ov,note,center:[opt.lat,opt.lng],z:opt.z,minz:opt.minz||5,
    failed:false,cache:new Map(),hcache:new Map(),draw:opt.draw,onmove:opt.onmove};
  M.size=()=>({w:box.clientWidth||900,h:box.clientHeight||400});
  M.origin=()=>{const{w,h}=M.size();
    return [wx(M.center[1],M.z)-w/2, wy(M.center[0],M.z)-h/2];};
  M.toPx=(lat,lng)=>{const[ox,oy]=M.origin(); return [wx(lng,M.z)-ox, wy(lat,M.z)-oy];};
  M.bounds=()=>{const[ox,oy]=M.origin(),{w,h}=M.size();
    return {n:latOf(oy,M.z),s:latOf(oy+h,M.z),w:lngOf(ox,M.z),e:lngOf(ox+w,M.z)};};
  M.paint=(cont,cache,src,maxz,onerr,onok)=>{
    const {w,h}=M.size();
    const zt=Math.max(0,Math.min(maxz,Math.round(M.z))), sc=Math.pow(2,M.z-zt);
    const n=Math.pow(2,zt), cwx=wx(M.center[1],zt), cwy=wy(M.center[0],zt);
    const half=[w/2/sc,h/2/sc], size=Math.ceil(TS*sc)+1, keep=new Set();
    for(let x=Math.floor((cwx-half[0])/TS);x<=Math.floor((cwx+half[0])/TS);x++)
      for(let y=Math.floor((cwy-half[1])/TS);y<=Math.floor((cwy+half[1])/TS);y++){
        if(y<0||y>=n) continue;
        const xx=((x%n)+n)%n, key=`${zt}/${xx}/${y}`;
        keep.add(key);
        let img=cache.get(key);
        if(!img){
          img=new Image(); img.draggable=false; img.alt='';
          img.style.cssText='position:absolute;pointer-events:none;user-select:none';
          if(onerr) img.onerror=onerr;
          if(onok) img.onload=onok;
          img.src=src(zt,xx,y);
          cache.set(key,img); cont.appendChild(img);
        }
        img.style.left=(w/2+(x*TS-cwx)*sc).toFixed(1)+'px';
        img.style.top=(h/2+(y*TS-cwy)*sc).toFixed(1)+'px';
        img.style.width=img.style.height=size+'px';
      }
    cache.forEach((img,k)=>{ if(!keep.has(k)){ img.remove(); cache.delete(k); } });
  };
  M.renderTiles=()=>{
    const P=PROVIDERS[PROVIDER];
    M.tiles.style.transform=''; M.hz.style.transform='';
    if(!P.url||M.failed){
      M.cache.forEach(img=>img.remove()); M.cache.clear();
      M.note.textContent = M.failed ? '地図画像を読み込めない環境です。位置と距離だけ表示しています。' : '';
    }else{
      M.paint(M.tiles,M.cache,P.url,P.max,
        ()=>{ if(++M.errCount>=8 && !M.okCount){ M.failed=true; M.render(); } },
        ()=>{ M.okCount=(M.okCount||0)+1; });
      M.note.textContent=M.okCount?P.attr:'地図画像を読み込み中…';
    }
    /* ハザード（国土地理院）を上に重ねる */
    const H=HAZARDS[HAZARD];
    if(H&&H.url){
      M.paint(M.hz,M.hcache,H.url,H.max,null,()=>{ M.hzOk=true; });
      M.note.textContent=(M.note.textContent||'')+'／'+H.label+'：国土地理院';
    }else if(M.hcache.size){ M.hcache.forEach(i=>i.remove()); M.hcache.clear(); }
  };
  M.renderOverlay=()=>{
    const {w,h}=M.size();
    M.ov.style.transform='';
    M.ov.setAttribute('viewBox',`0 0 ${w} ${h}`);
    while(M.ov.firstChild) M.ov.removeChild(M.ov.firstChild);
    M.draw(M);
    M.drawn={z:M.z,center:M.center.slice()};
    if(M.onmove) M.onmove(M);
  };
  M.render=()=>{ M.renderTiles(); M.renderOverlay(); };
  M.errCount=0; M.okCount=0;
  M._raf=null; M.drawn=null; M._settle=null;
  M.requestRender=()=>{ if(M._raf) return;
    M._raf=requestAnimationFrame(()=>{ M._raf=null; M.render(); }); };
  /* 拡大縮小の途中は、点を描き直さず拡大率だけ当てて滑らかに見せる。
     手を止めて140msたったら正確に描き直す。 */
  M.requestFast=()=>{
    if(!M.drawn){ M.requestRender(); return; }
    if(!M._fraf) M._fraf=requestAnimationFrame(()=>{
      M._fraf=null;
      M.renderTiles();
      const {w,h}=M.size(), s=Math.pow(2,M.z-M.drawn.z);
      const [cx,cy]=M.toPx(M.drawn.center[0],M.drawn.center[1]);
      M.ov.style.transformOrigin='50% 50%';
      M.ov.style.transform=`translate(${(cx-w/2).toFixed(2)}px,${(cy-h/2).toFixed(2)}px) scale(${s.toFixed(4)})`;
    });
    clearTimeout(M._settle);
    M._settle=setTimeout(()=>M.render(),140);
  };
  M.inView=(x,y,pad)=>{ const{w,h}=M.size(); pad=pad||60;
    return x>=-pad&&y>=-pad&&x<=w+pad&&y<=h+pad; };
  M.setZoom=(z,anchor,fast)=>{
    const P=PROVIDERS[PROVIDER];
    z=Math.max(M.minz,Math.min(P.max,z));
    if(Math.abs(z-M.z)<1e-4) return;
    if(anchor){
      const [ox,oy]=M.origin();
      const ax=ox+anchor[0], ay=oy+anchor[1];
      const lat=latOf(ay,M.z), lng=lngOf(ax,M.z);
      const k=Math.pow(2,z-M.z);
      const {w,h}=M.size();
      const nx=wx(lng,z)-(anchor[0]-w/2)*1, ny=wy(lat,z)-(anchor[1]-h/2)*1;
      M.z=z; M.center=[latOf(ny,z),lngOf(nx,z)];
      void k;
    } else M.z=z;
    if(fast) M.requestFast(); else M.requestRender();
  };
  M.setView=(lat,lng,z)=>{ M.center=[lat,lng]; if(z!=null) M.z=z; M.render(); };
  let drag=null;
  box.addEventListener('pointerdown',e=>{ drag={x:e.clientX,y:e.clientY,c:M.center.slice()};
    box.setPointerCapture(e.pointerId); box.style.cursor='grabbing'; });
  box.addEventListener('pointermove',e=>{
    if(!drag) return;
    const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
    M.tiles.style.transform=`translate(${dx}px,${dy}px)`;
    M.ov.style.transform=`translate(${dx}px,${dy}px)`;
  });
  const end=e=>{
    if(!drag) return;
    const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
    const cx=wx(drag.c[1],M.z)-dx, cy=wy(drag.c[0],M.z)-dy;
    M.center=[latOf(cy,M.z),lngOf(cx,M.z)];
    drag=null; box.style.cursor='grab'; M.render();
  };
  box.addEventListener('pointerup',end); box.addEventListener('pointercancel',end);
  box.addEventListener('wheel',e=>{
    e.preventDefault();
    const r=box.getBoundingClientRect();
    let d=e.deltaY;
    if(e.deltaMode===1) d*=16; else if(e.deltaMode===2) d*=400;
    /* 1ノッチで約0.12段。Shiftを押しながらだとさらに細かく、右上の感度で調整できる */
    let f=0.0012*ZSENS*(e.shiftKey?0.3:1)*(e.ctrlKey?2.5:1);
    const step=Math.max(-0.25,Math.min(0.25,-d*f));
    M.setZoom(M.z+step,[e.clientX-r.left,e.clientY-r.top],true);
  },{passive:false});
  box.addEventListener('dblclick',e=>{
    const r=box.getBoundingClientRect();
    M.setZoom(M.z+1,[e.clientX-r.left,e.clientY-r.top]);
  });
  return M;
}

/* 地図のピンに触れたときに出す吹き出し */
function tipOf(M){
  let t=M.box.querySelector('.maptip');
  if(!t){ t=document.createElement('div'); t.className='maptip'; M.box.appendChild(t); }
  return t;
}
function showTip(M,x,y,html){
  const t=tipOf(M); t.innerHTML=html; t.style.display='block';
  const {w,h}=M.size(), tw=t.offsetWidth, th=t.offsetHeight;
  let left=x-tw/2, top=y-th-34;
  if(top<4) top=y+16;                       /* 上に出せないときは下に */
  left=Math.max(4,Math.min(w-tw-4,left));
  top=Math.max(4,Math.min(h-th-4,top));
  t.style.left=left.toFixed(0)+'px'; t.style.top=top.toFixed(0)+'px';
}
function hideTip(M){ const t=M.box.querySelector('.maptip'); if(t) t.style.display='none'; }

function drawShoken(M,c){
  hideTip(M);
  const p=COORD[c.hid], [cx,cy]=M.toPx(p[0],p[1]), m=mpp(p[0],M.z);
  const bands=bandList();
  const bandIdx=km=>{ for(let i=0;i<bands.length;i++) if(km<=bands[i]+1e-6) return i; return bands.length-1; };
  const ring=svgEl('g',{},M.ov);
  bands.forEach((k,i)=>{
    const r=k*1000/m, last=(i===bands.length-1), col=last?'#0f7a5f':BAND_COL[Math.min(i,BAND_COL.length-1)];
    svgEl('circle',{cx,cy,r,fill:last?'#0f7a5f':'none','fill-opacity':last?.04:0,stroke:col,
      'stroke-opacity':last?.9:.45,'stroke-width':last?1.6:1,'stroke-dasharray':last?'6 4':'3 4'},ring);
    svgEl('text',{x:cx,y:cy-r-4,'font-size':last?12:11,'text-anchor':'middle','font-weight':700,
      fill:col,'fill-opacity':last?1:.85,
      style:'paint-order:stroke;stroke:#fff;stroke-width:3.5px;stroke-linejoin:round'},ring).textContent=k+'km';
  });
  const marks={}, _wide=M.size().w>=520;   /* 画面が狭いときは店名を出すと重なって読めない */
  const PIN='M0,0 C-7.5,-10 -10,-16 0,-25 C10,-16 7.5,-10 0,0 Z';
  (c.list||[]).forEach((r,i)=>{
    const q=COORD[r.id]; if(!q) return;
    const [x,y]=M.toPx(q[0],q[1]);
    if(!M.inView(x,y,160)) return;
    const col=BAND_COL[Math.min(bandIdx(r.km),BAND_COL.length-1)], big=r.total>=1000;
    const g=svgEl('g',{transform:`translate(${x.toFixed(1)} ${y.toFixed(1)})`,style:'pointer-events:auto;cursor:pointer'},M.ov);
    const pth=svgEl('path',{d:PIN,fill:col,stroke:'#fff','stroke-width':big?2.6:1.4},g);
    svgEl('circle',{cx:0,cy:-16.5,r:7,fill:'#fff','fill-opacity':.96},g);
    svgEl('text',{x:0,y:-13,'font-size':10,'font-weight':700,'text-anchor':'middle',fill:col},g).textContent=String(i+1);
    const tipHTML=`<b>${esc(r.name)}</b>`
      +`<span class="tk">${esc(r.city)}${GRP_OF[r.id]?'／'+esc(GRP_OF[r.id]):''}</span><br>`
      +`合計 <b style="display:inline">${fmt(r.total)}台</b>`
      +`<span class="tk">（P${fmt(r.p)}・S${fmt(r.s)}）</span><br>`
      +`基準店から <b style="display:inline">${r.km.toFixed(2)}km</b>`
      +`<br><span class="tb" style="background:${col}">No.${i+1}</span>`
      +(big?' <span class="tb" style="background:#9a5407">1,000台以上</span>':'');
    g.onmouseenter=()=>{
      showTip(M,x,y,tipHTML);
      pth.setAttribute('stroke','#1f6feb'); pth.setAttribute('stroke-width','3.4');
      const tr=document.querySelector(`#detail tr[data-riv="${r.id}"]`); if(tr) tr.classList.add('hot');
    };
    g.onmouseleave=()=>{
      hideTip(M);
      pth.setAttribute('stroke','#fff'); pth.setAttribute('stroke-width',big?'2.6':'1.4');
      const tr=document.querySelector(`#detail tr[data-riv="${r.id}"]`); if(tr) tr.classList.remove('hot');
    };
    if(_wide ? (c.list.length<=24||big) : c.list.length<=6){
      svgEl('text',{x:0,y:11,'font-size':11,'text-anchor':'middle',fill:'#16202b','font-weight':big?700:600,
        style:'paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round'},g)
        .textContent=r.name+(r.total?` ${fmt(r.total)}`:'');
    }
    marks[r.id]=g;
    g.onclick=()=>{ const tr=document.querySelector(`#detail tr[data-riv="${r.id}"]`);
      if(tr){ tr.scrollIntoView({block:'center'}); tr.classList.add('hot'); setTimeout(()=>tr.classList.remove('hot'),900);} };
  });
  /* 基準店：地図の中でいちばん目立つ必要があるので、的（まと）＋大きいピン＋名札で描く */
  const gc=svgEl('g',{transform:`translate(${cx.toFixed(1)} ${cy.toFixed(1)})`},M.ov);
  svgEl('circle',{cx:0,cy:0,r:26,fill:'#fff','fill-opacity':.55},gc);
  svgEl('circle',{cx:0,cy:0,r:26,fill:'none',stroke:'#0f7a5f','stroke-opacity':.5,'stroke-width':2},gc);
  svgEl('circle',{cx:0,cy:0,r:15,fill:'none',stroke:'#0f7a5f','stroke-opacity':.8,'stroke-width':2},gc);
  svgEl('line',{x1:-34,y1:0,x2:-27,y2:0,stroke:'#0f7a5f','stroke-width':2.4},gc);
  svgEl('line',{x1:27,y1:0,x2:34,y2:0,stroke:'#0f7a5f','stroke-width':2.4},gc);
  svgEl('line',{x1:0,y1:-34,x2:0,y2:-27,stroke:'#0f7a5f','stroke-width':2.4},gc);
  svgEl('line',{x1:0,y1:27,x2:0,y2:34,stroke:'#0f7a5f','stroke-width':2.4},gc);
  svgEl('path',{d:PIN,fill:'#0f7a5f',stroke:'#fff','stroke-width':2.4,transform:'scale(1.55)'},gc);
  svgEl('circle',{cx:0,cy:-25.5,r:9.5,fill:'#fff'},gc);
  svgEl('text',{x:0,y:-21,'font-size':13,'font-weight':700,'text-anchor':'middle',fill:'#0f7a5f'},gc).textContent='★';
  /* 名札。白地に緑の枠を敷いて、地図の文字と混ざらないようにする */
  const lt='★ '+c.name+(c.total?`　${fmt(c.total)}台`:''), fs=13;
  let lw=0; for(const ch of lt) lw += /[\x00-\xff]/.test(ch) ? fs*0.56 : fs*1.02;
  const lx=-lw/2-9, ly=42, lh=23;
  svgEl('rect',{x:lx,y:ly,width:lw+18,height:lh,rx:4,fill:'#fff','fill-opacity':.97,
    stroke:'#0f7a5f','stroke-width':1.6},gc);
  svgEl('text',{x:0,y:ly+16,'font-size':fs,'font-weight':700,'text-anchor':'middle',fill:'#0b5f4a'},gc).textContent=lt;
  gc.setAttribute('style','pointer-events:auto;cursor:default');
  gc.onmouseenter=()=>showTip(M,cx,cy,`<b>★ ${esc(c.name)}</b>`
    +`<span class="tk">${esc(c.city)}　${esc(c.addr)}</span><br>`
    +`合計 <b style="display:inline">${fmt(c.total)}台</b>`
    +`<span class="tk">（P${fmt(c.p)}・S${fmt(c.s)}）</span><br>`
    +`半径${RKM}km：競合 ${c.nRiv==null?'—':c.nRiv}店／商圏人口 ${fmt(c.pop)}人`
    +(c.ppm?`<br>1台あたり人口 <b style="display:inline">${fmt(Math.round(c.ppm))}人</b>`:'')
    +`<br><span class="tb" style="background:#0f7a5f">基準店</span>`);
  gc.onmouseleave=()=>hideTip(M);
  const {w,h}=M.size(), bar=1000/m;
  const g2=svgEl('g',{transform:`translate(${w-bar-18} ${h-16})`},M.ov);
  svgEl('line',{x1:0,y1:0,x2:bar,y2:0,stroke:'#1b2430','stroke-width':2},g2);
  svgEl('line',{x1:0,y1:-4,x2:0,y2:4,stroke:'#1b2430','stroke-width':2},g2);
  svgEl('line',{x1:bar,y1:-4,x2:bar,y2:4,stroke:'#1b2430','stroke-width':2},g2);
  svgEl('text',{x:bar/2,y:-6,'font-size':10,'text-anchor':'middle',fill:'#1b2430'},g2).textContent='1km';
  document.querySelectorAll('#detail tr[data-riv]').forEach(tr=>{
    const g=marks[tr.dataset.riv], path=g&&g.querySelector('path');
    tr.onmouseenter=()=>{ if(g) g.dispatchEvent(new Event('mouseenter')); tr.classList.add('hot'); };
    tr.onmouseleave=()=>{ if(g) g.dispatchEvent(new Event('mouseleave')); tr.classList.remove('hot'); };
  });
}

/* ===== 全県マップ ===== */
const OV={ready:false,map:null,home:{lat:35.05,lng:137.1,z:9}};
function buildOverview(){
  if(OV.ready){ OV.map.render(); return; }
  const box=document.getElementById('omap');
  /* データの範囲から初期表示を決める（県ごとに自動） */
  const _p=CANDS.map(c=>COORD[c.hid]).filter(Boolean);
  const _la=_p.map(x=>x[0]), _ln=_p.map(x=>x[1]);
  const _c=[( Math.min(..._la)+Math.max(..._la))/2, (Math.min(..._ln)+Math.max(..._ln))/2];
  const _w=box.clientWidth||900, _h=box.clientHeight||480;
  const _sy=Math.max(0.05,(Math.max(..._la)-Math.min(..._la)))*110570;
  const _sx=Math.max(0.05,(Math.max(..._ln)-Math.min(..._ln)))*111320*Math.cos(_c[0]*Math.PI/180);
  const _mpp=Math.max(_sy/(_h*0.86), _sx/(_w*0.86));
  OV.home={lat:_c[0],lng:_c[1],
    z:Math.max(5,Math.min(13, Math.log2(156543.03392*Math.cos(_c[0]*Math.PI/180)/_mpp)))};
  OV.map=makeMap(box,{lat:OV.home.lat,lng:OV.home.lng,z:OV.home.z,minz:5,draw:drawOverview,onmove:M=>{
    const r=document.getElementById('zrange'), v=document.getElementById('zval');
    if(r&&!r.matches(':active')) r.value=M.z.toFixed(1);
    if(v) v.textContent=M.z.toFixed(1);
  }});
  OV.ready=true;
  document.getElementById('zin').onclick=()=>OV.map.setZoom(Math.floor(OV.map.z)+1);
  document.getElementById('zout').onclick=()=>OV.map.setZoom(Math.ceil(OV.map.z)-1);
  document.getElementById('zreset').onclick=()=>OV.map.setView(OV.home.lat,OV.home.lng,OV.home.z);
  const zr=document.getElementById('zrange');
  zr.max=String(PROVIDERS[PROVIDER].max);
  zr.oninput=()=>{ OV.map.setZoom(parseFloat(zr.value),null,true);
    document.getElementById('zval').textContent=parseFloat(zr.value).toFixed(1); };
  document.getElementById('zsens').onchange=e=>{ ZSENS=parseFloat(e.target.value); };
  OV.map.render();
}
function drawOverview(M){
  hideTip(M);
  const P=PROVIDERS[PROVIDER];
  if(!P.url||M.failed){
    const path=rings=>rings.map(r=>'M'+r.map(([lng,lat])=>M.toPx(lat,lng).map(v=>v.toFixed(1)).join(',')).join('L')+'Z').join('');
    SHAPE.pref.forEach(p=>svgEl('path',{d:path(p.rings),fill:p.main?'#f6f8fa':'#e2e7ec',
      stroke:'#94a2ae','stroke-width':p.main?1.2:.7},M.ov));
    if(M.z>=9) SHAPE.cities.forEach(c=>{
      const [x,y]=M.toPx(c.lat,c.lng);
      if(!M.inView(x,y,40)) return;
      svgEl('text',{x,y,'font-size':11,fill:'#8d9ba7','text-anchor':'middle'},M.ov)
        .textContent=c.n.replace('名古屋市','');
    });
  }
  /* 表示範囲で一覧を絞る：地図側で範囲を決めてから、同じ条件で点も一覧も出す */
  const bbOn=document.getElementById('bbox').checked;
  const nb=bbOn?M.bounds():null;
  const same=(a,b)=>a&&b&&Math.abs(a.n-b.n)<1e-6&&Math.abs(a.s-b.s)<1e-6&&Math.abs(a.w-b.w)<1e-6&&Math.abs(a.e-b.e)<1e-6;
  if(!same(nb,F.bbox)){ F.bbox=nb; scheduleList(); }
  const rows=CANDS.filter(pass);
  const showR=document.getElementById('showRiv').checked;
  const ring=document.getElementById('circles').checked;
  const byCl=document.getElementById('clust').checked;
  const names=document.getElementById('cityname').checked;
  if(showR) CANDS.filter(c=>!pass(c)).forEach(c=>{
    const p=COORD[c.hid]; if(!p) return;
    const [x,y]=M.toPx(p[0],p[1]);
    if(!M.inView(x,y)) return;
    const d=svgEl('circle',{cx:x,cy:y,r:Math.max(2.5,Math.min(9,Math.sqrt(c.total)/4.5)),fill:tierColor(c.total),
      'fill-opacity':.4,stroke:'#fff','stroke-width':1,style:'pointer-events:auto;cursor:pointer'},M.ov);
    d.onmouseenter=()=>showTip(M,x,y,`<b>${esc(c.name)}</b><span class="tk">${esc(c.city)}</span><br>`
      +`合計 <b style="display:inline">${fmt(c.total)}台</b>`
      +`<span class="tk">（P${fmt(c.p)}・S${fmt(c.s)}）</span>`
      +`<br><span class="tb" style="background:#8a98a4">絞り込みの条件外</span>`);
    d.onmouseleave=()=>hideTip(M);
    d.onclick=ev=>{ ev.stopPropagation(); openCard(c); };
  });
  rows.forEach(c=>{
    const p=COORD[c.hid]; if(!p) return;
    const [x,y]=M.toPx(p[0],p[1]);
    if(!M.inView(x,y,ring?RKM*1000/mpp(p[0],M.z)+20:60)) return;
    if(ring) svgEl('circle',{cx:x,cy:y,r:RKM*1000/mpp(p[0],M.z),fill:'#0f7a5f','fill-opacity':.04,
      stroke:'#0f7a5f','stroke-opacity':.5,'stroke-width':1},M.ov);
    const n=nOf(c.id);
    const d=svgEl('circle',{cx:x,cy:y,r:Math.max(4,5+(c.total-400)/130),fill:byCl?CL_BY_I[c.cl].color:'#0f7a5f',
      'fill-opacity':.95,stroke:n.star?'#c9a227':'#fff','stroke-width':n.star?3:1.6,
      style:'pointer-events:auto;cursor:pointer'},M.ov);
    d.onmouseenter=()=>{
      d.setAttribute('stroke','#1f6feb'); d.setAttribute('stroke-width','3');
      showTip(M,x,y,`<b>${n.star?'★ ':''}${esc(c.name)}</b>`
        +`<span class="tk">${esc(c.city)}${c.grp?'／'+esc(c.grp):''}</span><br>`
        +`合計 <b style="display:inline">${fmt(c.total)}台</b>`
        +`<span class="tk">（P${fmt(c.p)}・S${fmt(c.s)}）</span><br>`
        +`半径${RKM}km：競合 ${c.nRiv==null?'—':c.nRiv}店／商圏人口 ${fmt(c.pop)}人`
        +(c.ppm?`<br>1台あたり人口 <b style="display:inline">${fmt(Math.round(c.ppm))}人</b>`:'')
        +(byCl?`<br><span class="tb" style="background:${CL_BY_I[c.cl].color}">${esc(CL_BY_I[c.cl].label)}</span>`:''));
    };
    d.onmouseleave=()=>{
      d.setAttribute('stroke',n.star?'#c9a227':'#fff'); d.setAttribute('stroke-width',n.star?'3':'1.6');
      hideTip(M);
    };
    d.onclick=ev=>{ ev.stopPropagation(); openCard(c); };
    if(names && M.z>=11) svgEl('text',{x,y:y-11,'font-size':11,fill:'#16202b','text-anchor':'middle'},M.ov).textContent=c.name;
  });
  document.getElementById('mapnote').textContent = byCl
    ? `候補 ${rows.length}店／色は商圏クラスタ（黒＝単独商圏）`
    : `候補 ${rows.length}店を表示`;

/* 外部地図へのリンク */

}
/* KML書き出し（Googleマイマップ等に読み込める） */
function kmlDownload(title,pts){
  const body=pts.map(p=>`<Placemark><name>${esc(p.name)}</name><description>${esc(p.desc||'')}</description>`+
    `<Point><coordinates>${p.lng},${p.lat},0</coordinates></Point></Placemark>`).join('');
  const xml=`<?xml version="1.0" encoding="UTF-8"?><kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>${esc(title)}</name>${body}</Document></kml>`;
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([xml],{type:'application/vnd.google-earth.kml+xml'}));

function csv(){
  const head=['店舗ID','店舗名','市区町村','住所','緯度','経度','チェーン推定','商圏クラスタ','クラスタ内店数','合計台数','P台数','S台数',`半径${RKM}km競合数`,'うち701台以上','うち1000台以上','商圏内競合台数計','商圏内シェア%','商圏人口','1台あたり人口',...BANDS.map((x,i)=>bandLabel(i)+'店数'),'検討中','メモ','台数出典URL'];
  const rows=sortList(CANDS.filter(pass)).map(c=>{
    const n=nOf(c.id), p=COORD[c.hid]||['',''];
    return [c.id,c.name,c.city,c.addr,p[0],p[1],c.grp||'',CL_BY_I[c.cl].label,CL_BY_I[c.cl].size,c.total,c.p,c.s,
      c.nRiv==null?'未確認':c.nRiv,c.n701==null?'未確認':c.n701,c.nBig==null?'未確認':c.nBig,
      c.areaT==null?'未確認':c.areaT,c.share==null?'':(c.share*100).toFixed(1),
      c.pop==null?'':c.pop,c.ppm==null?'':Math.round(c.ppm),
      ...(c.known?c.bands.map(b=>b.n):['','','','']),
      n.star?'★':'',(n.memo||'').replace(/\r?\n/g,' '),c.url];
  });
  const body=[head,...rows].map(r=>r.map(v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\ufeff'+body],{type:'text/csv;charset=utf-8'}));
  a.download='愛知県_パチンコM&A候補_抽出.csv'; a.click();
}

  const pan=(dx,dy)=>{ const [ox,oy]=M.origin(), {w,h}=M.size();
    M.center=[latOf(oy+h/2+dy,M.z),lngOf(ox+w/2+dx,M.z)]; M.requestRender(); };
  if(e.key==='+'||e.key==='='){ M.setZoom(Math.floor(M.z)+1); e.preventDefault(); }
  else if(e.key==='-'){ M.setZoom(Math.ceil(M.z)-1); e.preventDefault(); }
  else if(e.key==='ArrowLeft'){ pan(-d,0); e.preventDefault(); }
  else if(e.key==='ArrowRight'){ pan(d,0); e.preventDefault(); }
  else if(e.key==='ArrowUp'){ pan(0,-d); e.preventDefault(); }
  else if(e.key==='ArrowDown'){ pan(0,d); e.preventDefault(); }
});

/* ---- 認証：データはAES-256-GCMで暗号化。IDとパスワードから鍵を導出して復号する（サーバー不要） ---- */
(function(){
  const b64=t=>{const b=atob(t.replace(/\s+/g,''));const u=new Uint8Array(b.length);
    for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;};
  const form=document.getElementById('gateform'), msg=document.getElementById('gmsg'), btn=document.getElementById('gbtn');
  if(!window.crypto||!window.crypto.subtle){
    msg.textContent='この環境では復号機能（Web Crypto）が使えません。Chrome・Edge・Firefox・Safariの最新版で開いてください。';
    btn.disabled=true; return;
  }
  form.addEventListener('submit',async ev=>{
    ev.preventDefault();
    const id=document.getElementById('gid').value.trim(), pw=document.getElementById('gpw').value;
    if(!id||!pw){ msg.textContent='IDとパスワードを入力してください。'; return; }
    btn.disabled=true; msg.style.color='var(--mute)'; msg.textContent='確認しています…';
    try{
      const raw=b64(document.getElementById('payload').textContent);
      const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(id+'\n'+pw),'PBKDF2',false,['deriveKey']);
      const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:raw.slice(0,16),iterations:250000,hash:'SHA-256'},km,
        {name:'AES-GCM',length:256},false,['decrypt']);
      const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:raw.slice(16,28)},key,raw.slice(28));
      const txt=new TextDecoder().decode(plain);
      let exp=null; try{ exp=JSON.parse(txt)._exp||null; }catch(e){}
      if(exp){
        const d=new Date();
        const today=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
        if(today>exp){
          msg.style.color='var(--big)';
          msg.textContent='閲覧期限（'+exp+'）を過ぎています。ご入用の場合はご連絡ください。';
          btn.disabled=false; return;
        }
      }
      document.getElementById('payload').textContent='';
      document.body.classList.remove('locked');
      boot(txt);
      if(exp){ const sub=document.querySelector('.titlerow .sub');
        if(sub) sub.textContent+='／閲覧期限 '+exp; }
    }catch(e){
      msg.style.color='var(--big)';
      const wrong = !e || e.name==='OperationError' || e.name==='InvalidAccessError';
      msg.textContent = wrong ? 'IDまたはパスワードが違います。'
        : 'この環境では復号できませんでした（'+((e&&e.name)||e)+'）。Chrome・Edge・Firefoxの最新版で開いてください。';
      btn.disabled=false; document.getElementById('gpw').select();
    }
  });
  document.getElementById('gid').focus();
})();
